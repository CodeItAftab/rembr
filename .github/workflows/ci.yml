name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app-lint-typecheck:
    name: App — Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

  backend-lint-typecheck:
    name: Backend — Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Check formatting
        run: deno fmt --check --ignore=supabase/.branches
        continue-on-error: true

      - name: Typecheck
        run: deno check supabase/functions/**/*.ts
        continue-on-error: true